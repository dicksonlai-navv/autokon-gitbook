name: Auto-Translate English to Bahasa

on:
  push:
    paths:
      - 'en/*.md'
    branches:
      - main
  workflow_dispatch:  # 👈 This enables manual triggering

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai

      - name: Translate using OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          import os
          import openai

          openai.api_key = os.getenv("OPENAI_API_KEY")
          os.makedirs("id", exist_ok=True)

          for filename in os.listdir("en"):
              if filename.endswith(".md"):
                  with open(f"en/{filename}", "r", encoding="utf-8") as f:
                      content = f.read()

                  prompt = f"Translate the following Markdown content from English to Bahasa Indonesia. Keep formatting unchanged:\n\n{content}"

                  response = openai.ChatCompletion.create(
                      model="gpt-4",
                      messages=[
                          {"role": "system", "content": "You are a helpful translator."},
                          {"role": "user", "content": prompt}
                      ],
                      temperature=0.2
                  )

                  translated = response['choices'][0]['message']['content']
                  with open(f"id/{filename}", "w", encoding="utf-8") as out_file:
                      out_file.write(translated)

      - name: Commit translated files
        run: |
          git config --global user.email "translate-bot@example.com"
          git config --global user.name "Translate Bot"
          git add id/
          git commit -m "Auto-translated English docs to Bahasa" || echo "No changes"
          git push
