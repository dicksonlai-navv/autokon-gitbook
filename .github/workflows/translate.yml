name: Auto-Translate English to Bahasa

on:
  push:
    paths:
      - 'en/*.md'
    branches:
      - main
  workflow_dispatch:  # 👈 This enables manual triggering

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openai --upgrade

      - name: Translate using OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python translate.py

      - name: Commit translated files
        run: |
          git config --global user.email "translate-bot@example.com"
          git config --global user.name "Translate Bot"
          git add id/
          git commit -m "Auto-translated English docs to Bahasa" || echo "No changes"
          git push
